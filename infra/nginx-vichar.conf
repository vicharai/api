# ============================================================================
# Vichar — nginx edge config for app.vichar.io / api.vichar.io
#
# INSTALL (as root, on the host — NOT inside the container):
#   1. This file is meant to be `include`d from the nginx.conf `http { ... }`
#      block, e.g. via:
#          include /etc/nginx/llmgateway-demo/*.conf;
#      or copied into /etc/nginx/sites-enabled/ (Debian layout). The `map`
#      and `server` blocks below are http-context directives.
#   2. TLS bootstrap: the ssl_certificate paths are Let's Encrypt
#      placeholders. If the certs don't exist yet, `nginx -t` will fail.
#      Either:
#        a. temporarily install only the `listen 80` server block, then run
#           `certbot --nginx -d app.vichar.io -d api.vichar.io` — certbot will
#           create/patch the 443 blocks and cert paths itself; or
#        b. issue the certs first (`certbot certonly --webroot/-–standalone`)
#           so the placeholder paths resolve, then `nginx -t && reload`.
#      Each server block below has a clean single `server_name` so
#      `certbot --nginx` can map domains to blocks unambiguously.
#   3. `nginx -t && systemctl reload nginx`.
#
# ROUTING:
#   app.vichar.io  -> UI              http://127.0.0.1:3302 (container :3002)
#   api.vichar.io  -> gateway (LLM)   http://127.0.0.1:4301 (container :4001)
#                     for the public inference/API prefixes below
#                  -> api (mgmt/auth) http://127.0.0.1:4302 (container :4002)
#                     catch-all: /auth/* /user/* /orgs/* /internal/* /public/*
#                     /scim/* and api-side /v1/{master,sessions,wallet,wallets,
#                     customers,connect,webhooks,config,skills,...}
#
#   Debug surfaces are deliberately closed to the public:
#     /metrics /docs /json -> 404.
#   /admin stays proxied: the API enforces its own session + ADMIN_EMAILS
#   allowlist and Vichar's manual plan-assignment endpoint lives under it.
# ============================================================================

# Websocket-safe Connection header (realtime endpoint, SSE, upgrades).
map $http_upgrade $vichar_connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------------------------
# HTTP -> HTTPS redirect (certbot --nginx can also use this for ACME).
# ----------------------------------------------------------------------------
server {
    listen 80;
    server_name app.vichar.io api.vichar.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# app.vichar.io — UI (Next.js standalone, container :3002 -> host :3302)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name app.vichar.io;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate     /etc/letsencrypt/live/app.vichar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vichar.io/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vichar_connection_upgrade;
        proxy_buffering off;
    }
}

# ----------------------------------------------------------------------------
# api.vichar.io — path-split between gateway (:4301) and api (:4302)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.vichar.io;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate     /etc/letsencrypt/live/api.vichar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vichar.io/privkey.pem;

    # Audio/image uploads can be chunky.
    client_max_body_size 100m;

    # ---- closed debug/admin surfaces (public 404) --------------------------
    # Gateway debug surfaces:
    location /metrics { return 404; }
    location /docs    { return 404; }
    location /json    { return 404; }
    # exposed publicly on this vhost:

    # ---- gateway routes (public LLM API, OpenAI-compatible) -----------------
    # All of these prefixes go to apps/gateway:
    #   /v1/chat        /v1/embeddings   /v1/images      /v1/key
    #   /v1/models      /v1/moderations  /v1/ocr         /v1/rerank
    #   /v1/systemone   /v1/messages     /v1/responses   /v1/audio
    #   /v1/realtime    /v1/videos       /v1/credits     /v1/ai
    #   /v2/ai  /v3/ai  /v4/ai
    #   /mcp    /oauth/ /.well-known/    /openapi.json   /robots.txt
    # Regex is evaluated before the `location /` prefix catch-all below.
    location ~ ^/(v1/(chat|embeddings|images|key|models|moderations|ocr|rerank|systemone|messages|responses|audio|realtime|videos|credits|ai)|v[2-4]/ai|mcp|oauth/|\.well-known/|openapi\.json$|robots\.txt$) {
        proxy_pass http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vichar_connection_upgrade;
        # Long-lived streaming/SSE/realtime responses: never buffer, never
        # time out an in-flight generation early.
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---- api catch-all (management/auth) ------------------------------------
    # Carries /auth/* /user/* /orgs/* /internal/* /public/* /scim/* plus the
    # api-side /v1/* endpoints not claimed by the gateway regex above.
    location / {
        proxy_pass http://127.0.0.1:4302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vichar_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
