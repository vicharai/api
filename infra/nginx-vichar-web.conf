# vichar.io marketing site: static files from apps/web/out, rsynced to /var/www/vichar.io.
# HTTPS is added by certbot once vichar.io DNS points at this host.
server {
    listen 80;
    listen [::]:80;
    server_name vichar.io www.vichar.io;

    root /var/www/vichar.io;
    index index.html;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    include /etc/nginx/snippets/vichar-security-headers.conf;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/vichar-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
