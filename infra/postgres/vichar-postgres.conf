# Vichar Postgres drop-in (included from postgresql.conf by the entrypoint).
# WAL archiving is armed via archive_command; wal-push.sh no-ops until the
# R2/WAL-G env is present.
listen_addresses = '*'
wal_level = replica
archive_mode = on
archive_command = '/usr/local/bin/wal-push.sh %p'
archive_timeout = 60
