[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# Vichar deployment: only postgresql, redis, ui, code, api, gateway, worker run.
# The upstream playground, docs, admin (ee) and airside programs are removed
# here on purpose — those apps are not built by infra/unified.vichar.dockerfile
# and their [program:] blocks would only produce supervisord FATAL entries.

[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/data -k /var/run/postgresql -p 5432
user=postgres
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PGDATA="/var/lib/postgresql/data"

[program:redis]
command=/usr/local/bin/redis-server --protected-mode no --bind 0.0.0.0 --port 6379 --appendonly no --save "" --dir /var/lib/redis
user=redis
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:ui]
command=/root/.asdf/shims/node .next/standalone/apps/ui/server.js
directory=/app/apps/ui
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3002,NODE_ENV=production,HOSTNAME=0.0.0.0

[program:code]
command=/root/.asdf/shims/node .next/standalone/apps/code/server.js
directory=/app/apps/code
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3004,NODE_ENV=production,HOSTNAME=0.0.0.0

[program:api]
command=/root/.asdf/shims/node --enable-source-maps dist/serve.js
directory=/app/apps/api
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=4002,NODE_ENV=production

[program:gateway]
command=/root/.asdf/shims/node --enable-source-maps dist/serve.js
directory=/app/apps/gateway
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=4001,NODE_ENV=production

[program:worker]
command=/root/.asdf/shims/node --enable-source-maps dist/index.js
directory=/app/apps/worker
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=NODE_ENV=production

; Stage-1 failover-test upstream (not a real provider): OpenAI-compatible mock
; on :4499. The vichar-failover-check model maps aws-bedrock (primary) -> openai
; (this mock) so cross-provider fallback is exercisable without paid keys.
[program:mock-openai]
command=/root/.asdf/shims/node /app/infra/mock-provider.mjs
directory=/app
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=NODE_ENV=production
