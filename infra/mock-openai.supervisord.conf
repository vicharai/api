; STAGING ONLY — never mount this file into the production vichar container.
; Fake OpenAI-compatible upstream on :4499 used to exercise cross-provider
; failover without a paid key (vichar-failover-check maps aws-bedrock ->
; openrouter -> openai, where "openai" is this mock).
; Mounted by infra/docker-compose.vichar-staging.yml into
; /etc/supervisor/conf.d/extra.d/.
[program:mock-openai]
command=/root/.asdf/shims/node /app/infra/mock-provider.mjs
directory=/app
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=NODE_ENV=production
