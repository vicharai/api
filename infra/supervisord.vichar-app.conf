[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# Vichar app image: ui, docs, api, gateway, worker. Postgres and Redis run as
# separate compose services — see infra/docker-compose.vichar.yml.

# supervisorctl control socket — without these three sections
# `docker exec <app> supervisorctl start worker` has nothing to talk to
# (verified on the legacy image: "unix:///var/run/supervisor.sock no such
# file"). vichar-deploy uses it to start the worker on the newly-live colour.
[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:ui]
command=/root/.asdf/shims/node .next/standalone/apps/ui/server.js
directory=/app/apps/ui
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3002,NODE_ENV=production,HOSTNAME=0.0.0.0

[program:docs]
command=/root/.asdf/shims/node .next/standalone/apps/docs/server.js
directory=/app/apps/docs
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3005,NODE_ENV=production,HOSTNAME=0.0.0.0

[program:api]
command=/root/.asdf/shims/node --enable-source-maps dist/serve.js
directory=/app/apps/api
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=4002,NODE_ENV=production

[program:gateway]
command=/root/.asdf/shims/node --enable-source-maps dist/serve.js
directory=/app/apps/gateway
user=root
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=4001,NODE_ENV=production

# autostart is env-driven so blue/green deploys can keep background jobs on
# exactly one side: VICHAR_WORKER_AUTOSTART=false on the inactive colour.
[program:worker]
command=/root/.asdf/shims/node --enable-source-maps dist/index.js
directory=/app/apps/worker
user=root
autostart=%(ENV_VICHAR_WORKER_AUTOSTART)s
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=NODE_ENV=production

[include]
files = /etc/supervisor/conf.d/extra.d/*.conf
